<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Prediksi Risiko Stroke</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background: #f4f6f9;
        }
        .card {
            border-radius: 12px;
        }
        .form-control, .form-select {
            border-radius: 8px;
        }
        .judul {
            font-weight: 600;
        }
        .hasil-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h3 class="text-center judul mb-4">Prediksi Risiko Stroke</h3>

                    <form id="formPrediksi">

                        <h6 class="text-primary mb-2">Data Pasien</h6>

                        <div class="mb-2">
                            <label class="form-label">Usia</label>
                            <input class="form-control" type="number" name="age" required>
                        </div>

                        <div class="mb-2">
                            <label class="form-label">BMI</label>
                            <input class="form-control" type="number" step="0.1" name="bmi" required>
                        </div>

                        <div class="mb-2">
                            <label class="form-label">Rata-rata Glukosa</label>
                            <input class="form-control" type="number" step="0.1"
                                   name="avg_glucose_level" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-2">
                                <label class="form-label">Jenis Kelamin</label>
                                <select class="form-select" name="gender">
                                    <option value="1">Laki-laki</option>
                                    <option value="0">Perempuan</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-2">
                                <label class="form-label">Hipertensi</label>
                                <select class="form-select" name="hypertension">
                                    <option value="0">Tidak</option>
                                    <option value="1">Ya</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Penyakit Jantung</label>
                            <select class="form-select" name="heart_disease">
                                <option value="0">Tidak Ada</option>
                                <option value="1">Ada</option>
                            </select>
                        </div>

                        <div class="d-grid">
                            <button class="btn btn-primary btn-lg" type="submit">
                                Prediksi Risiko
                            </button>
                        </div>
                    </form>

                    <!-- HASIL -->
                    <div id="hasilContainer" class="hasil-box d-none">
                        <h5 class="text-center mb-2" id="hasil"></h5>

                        <div class="progress mb-3">
                            <div id="progressRisiko" class="progress-bar bg-danger"
                                 role="progressbar"></div>
                        </div>

                        <canvas id="chartHasil"></canvas>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script>
let chart;

document.getElementById("formPrediksi").onsubmit = async function(e){
    e.preventDefault();

    const data = new FormData(this);

    const response = await fetch("/predict", {
        method: "POST",
        body: data
    });

    const hasil = await response.json();

    document.getElementById("hasilContainer").classList.remove("d-none");

    document.getElementById("hasil").innerHTML =
        `Hasil Prediksi: <strong>${hasil.hasil}</strong>`;

    const progress = document.getElementById("progressRisiko");
    progress.style.width = hasil.probabilitas + "%";
    progress.innerHTML = hasil.probabilitas + "%";

    tampilChart(hasil.probabilitas);
}

function tampilChart(prob){
    if(chart) chart.destroy();

    chart = new Chart(document.getElementById("chartHasil"), {
        type: "doughnut",
        data: {
            labels: ["Risiko Stroke", "Normal"],
            datasets: [{
                data: [prob, 100 - prob],
                backgroundColor: ["#dc3545", "#e9ecef"]
            }]
        },
        options: {
            plugins: {
                legend: {
                    position: "bottom"
                }
            }
        }
    });
}
</script>

</body>
</html>
